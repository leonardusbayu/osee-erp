name: Quality and isolated PostgreSQL checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: osee_ci
          POSTGRES_USER: osee_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U osee_ci -d osee_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DJANGO_READ_DOT_ENV: '0'
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: synthetic-ci-only-not-used-by-any-company-000000000000000000
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      OSEE_DEMO_MODE: '0'
      OSEE_LOCAL_SETUP: '0'
      POSTGRES_DB: osee_ci
      POSTGRES_USER: osee_ci
      POSTGRES_PASSWORD: synthetic-ci-only
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r deploy/quality-requirements.txt
      - run: python -m pip check
      - run: python -m ruff check --select E9,F63,F7,F82 core finance taxes evidence imports director marketing webapp config deploy scripts
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: python -m unittest scripts.tests_backup
      - run: python -m compileall -q core finance taxes evidence imports director marketing webapp config deploy scripts
      - name: Production settings and collected assets
        run: |
          export OTP_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export DJANGO_DEBUG=0
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --noinput
      - name: Container build
        run: docker build -t osee-ci .
      - name: PostgreSQL backup and empty-target recovery
        run: >-
          docker run --rm --network host --entrypoint python
          -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_USER=osee_ci
          -e POSTGRES_PASSWORD=synthetic-ci-only -e OSEE_TEST_POSTGRES_BACKUP=1
          osee-ci -m unittest scripts.tests_backup_postgres
      - name: SQLite-to-empty-PostgreSQL transfer rehearsal
        run: >-
          docker run --rm --network host --entrypoint python
          -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_USER=osee_ci
          -e POSTGRES_PASSWORD=synthetic-ci-only -e OSEE_TEST_POSTGRES_TRANSFER=1
          osee-ci -m unittest scripts.tests_sqlite_to_postgres
