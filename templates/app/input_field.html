{% if field.is_hidden %}{{ field }}{{ field.errors }}{% else %}
<div class="field-row {% if field.errors %}has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{% if field.label == 'Supplier' %}Pemasok{% else %}{{ field.label }}{% endif %}{% if field.field.required %}<span class="required" aria-label="wajib"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="field-help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field-error" role="alert">{{ error }}</p>{% endfor %}
</div>
{% endif %}
