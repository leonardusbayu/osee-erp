{% if form.non_field_errors %}<div class="message message-error">{{ form.non_field_errors }}</div>{% endif %}
<div class="form-fields">{% for field in form %}{% if field.is_hidden %}{{ field }}{% else %}<div class="field-row {% if field.errors %}has-error{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required"> *</span>{% endif %}</label>{{ field }}{% if field.help_text %}<p class="field-help">{{ field.help_text }}</p>{% endif %}{% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}</div>{% endif %}{% endfor %}</div>
