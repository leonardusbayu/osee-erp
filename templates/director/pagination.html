{% if page.has_other_pages %}<nav class="pagination" aria-label="Halaman data">{% if page.has_previous %}<a class="button button-secondary button-small" href="?page={{ page.previous_page_number }}&amp;year={{ year|default:'' }}&amp;q={{ query|urlencode }}&amp;channel={{ selected_channel|urlencode }}&amp;status={{ status|urlencode }}">Sebelumnya</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button button-secondary button-small" href="?page={{ page.next_page_number }}&amp;year={{ year|default:'' }}&amp;q={{ query|urlencode }}&amp;channel={{ selected_channel|urlencode }}&amp;status={{ status|urlencode }}">Berikutnya</a>{% endif %}</nav>{% endif %}
