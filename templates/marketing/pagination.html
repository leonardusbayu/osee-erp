{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Halaman daftar"><span>Halaman {{ page.number }} dari {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a class="button button-secondary button-small" href="?{{ pagination_query }}&amp;page={{ page.previous_page_number }}">← Sebelumnya</a>{% endif %}{% if page.has_next %}<a class="button button-secondary button-small" href="?{{ pagination_query }}&amp;page={{ page.next_page_number }}">Berikutnya →</a>{% endif %}</div></nav>{% endif %}
